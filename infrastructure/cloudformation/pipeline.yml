{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "MCQ Hedge Fund Market Context Pipeline infrastructure",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "Default": "prod",
      "AllowedValues": ["prod", "staging"]
    },
    "DataBucket": {
      "Type": "String",
      "Description": "Existing S3 bucket for MarketContext JSON output"
    },
    "WatchTickers": {
      "Type": "String",
      "Default": "AAPL,MSFT,NVDA,SPY,QQQ"
    }
  },
  "Resources": {
    "PipelineLambdaRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": {"Fn::Sub": "mcq-hedge-fund-pipeline-role-${Environment}"},
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"Service": "lambda.amazonaws.com"},
            "Action": "sts:AssumeRole"
          }]
        },
        "ManagedPolicyArns": ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"],
        "Policies": [{
          "PolicyName": "PipelineS3Access",
          "PolicyDocument": {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:GetObject", "s3:ListBucket"],
              "Resource": [
                {"Fn::Sub": "arn:aws:s3:::${DataBucket}"},
                {"Fn::Sub": "arn:aws:s3:::${DataBucket}/*"}
              ]
            }]
          }
        }, {
          "PolicyName": "PipelineSecretsAccess",
          "PolicyDocument": {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": "secretsmanager:GetSecretValue",
              "Resource": {"Fn::Sub": "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcq-hedge-fund/*"}
            }]
          }
        }]
      }
    },
    "PipelineLogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {"Fn::Sub": "/mcq-hedge-fund/pipeline/${Environment}"},
        "RetentionInDays": 30
      }
    },
    "PipelineLambda": {
      "Type": "AWS::Lambda::Function",
      "Properties": {
        "FunctionName": {"Fn::Sub": "mcq-hedge-fund-pipeline-${Environment}"},
        "Description": "Market Context Pipeline placeholder deployed by CloudFormation",
        "Runtime": "nodejs20.x",
        "Handler": "index.handler",
        "Role": {"Fn::GetAtt": ["PipelineLambdaRole", "Arn"]},
        "Timeout": 300,
        "MemorySize": 512,
        "Environment": {
          "Variables": {
            "DATA_BUCKET": {"Ref": "DataBucket"},
            "WATCH_TICKERS": {"Ref": "WatchTickers"},
            "ENVIRONMENT": {"Ref": "Environment"}
          }
        },
        "Code": {
          "ZipFile": "exports.handler = async (event) => ({ statusCode: 200, body: JSON.stringify({ ok: true, event }) });"
        },
        "Tags": {
          "Project": "mcq-hedge-fund",
          "Environment": {"Ref": "Environment"}
        }
      }
    },
    "DailyOpenRule": {
      "Type": "AWS::Events::Rule",
      "Properties": {
        "Name": {"Fn::Sub": "mcq-hedge-fund-daily-open-${Environment}"},
        "ScheduleExpression": "cron(0 14 ? * MON-FRI *)",
        "State": "ENABLED",
        "Targets": [{
          "Id": "MarketContextPipelineDaily",
          "Arn": {"Fn::GetAtt": ["PipelineLambda", "Arn"]},
          "Input": {"Fn::Sub": "{\"tickers\":\"${WatchTickers}\",\"trigger\":\"daily-open\"}"}
        }]
      }
    },
    "IntraMarketRule": {
      "Type": "AWS::Events::Rule",
      "Properties": {
        "Name": {"Fn::Sub": "mcq-hedge-fund-intraday-${Environment}"},
        "ScheduleExpression": "cron(30 14-21 ? * MON-FRI *)",
        "State": "ENABLED",
        "Targets": [{
          "Id": "MarketContextPipelineIntraday",
          "Arn": {"Fn::GetAtt": ["PipelineLambda", "Arn"]},
          "Input": {"Fn::Sub": "{\"tickers\":\"${WatchTickers}\",\"trigger\":\"intraday\"}"}
        }]
      }
    },
    "LambdaPermissionDaily": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {"Ref": "PipelineLambda"},
        "Action": "lambda:InvokeFunction",
        "Principal": "events.amazonaws.com",
        "SourceArn": {"Fn::GetAtt": ["DailyOpenRule", "Arn"]}
      }
    },
    "LambdaPermissionIntraday": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "FunctionName": {"Ref": "PipelineLambda"},
        "Action": "lambda:InvokeFunction",
        "Principal": "events.amazonaws.com",
        "SourceArn": {"Fn::GetAtt": ["IntraMarketRule", "Arn"]}
      }
    }
  },
  "Outputs": {
    "BucketName": {"Value": {"Ref": "DataBucket"}},
    "LambdaFunctionName": {"Value": {"Ref": "PipelineLambda"}},
    "LambdaRoleArn": {"Value": {"Fn::GetAtt": ["PipelineLambdaRole", "Arn"]}}
  }
}