name: Market Context Pipeline

on:
  # Cron paused until install + secrets + S3 path are green.
  # Restore after successful workflow_dispatch:
  #   schedule:
  #     - cron: '0 14 * * 1-5'       # 9:00 AM ET daily open
  #     - cron: '30 14-21 * * 1-5'   # Every 30 min during market hours
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Stub package-lock.json breaks npm ci (see Docker fix 677d5e4).
      # Use npm install until a real lockfile is committed.
      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run Market Context Pipeline
        env:
          FRED_API_KEY:           ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY:  ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          AWS_REGION:             ${{ secrets.AWS_REGION }}
          DATA_BUCKET:            ${{ secrets.DATA_BUCKET }}
          AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WATCH_TICKERS:          'AAPL,MSFT,NVDA,SPY,QQQ'
        run: npx ts-node src/data/orchestrator.ts

      - name: Pipeline status
        if: failure()
        run: echo "[ALERT] Market Context Pipeline failed — check logs for FRED/EDGAR/AV errors"
